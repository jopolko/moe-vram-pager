[project]
name = "obench-interp"
version = "0.0.1"
description = "Mechanistic interpretability pipeline for openbench-toolkit (decoupled from the llama.cpp/GGUF path)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "datasets>=2.20",
    "transformer_lens>=2.0",
    "sae_lens>=4.0",
    "nnsight>=0.7",  # exp2/exp3 use the 0.7 trace API (model.output.logits, tracer.iter, [seq,d] acts)
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "einops>=0.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
obench-interp = "obench_interp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obench_interp"]

[tool.ruff]
line-length = 100

# NOTE: this project's venv and lockfile are intentionally NOT the repo's build
# system. Keep it isolated. See interpretability/README.md.
