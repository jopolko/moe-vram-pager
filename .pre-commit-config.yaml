# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: prompts/.*.txt
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
    # interpretability/probes/*.npz are deliberate committed probe weights
    # (fp16, ~1.5 MB each) so the live viewer works without a training step
    exclude: ^interpretability/probes/.*\.npz$
- repo: https://github.com/PyCQA/flake8
  rev: 7.0.0
  hooks:
  - id: flake8
    # flake8-no-print only has releases pinned to flake8==4.0.1, which
    # conflicts with the flake8==7.0.0 above and just fails to install.
    # dropped rather than downgrading flake8: scripts/model_picker.py is a
    # CLI tool that's supposed to print its results, the rule doesn't fit
    # this fork's actual Python usage anyway.
- repo: local
  hooks:
  - id: gen-arch-map
    name: regenerate arch-map.json from conversion/__init__.py
    entry: python3 scripts/gen_arch_map.py
    language: system
    files: ^conversion/__init__\.py$
    pass_filenames: false
